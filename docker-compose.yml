name: ediary
services:
  database:
    image: postgres:16
    container_name: EDiaryDatabase
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: "ediary_db"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    networks:
      - dockerapi
networks:
  dockerapi:
    name: ediary_dockerapi